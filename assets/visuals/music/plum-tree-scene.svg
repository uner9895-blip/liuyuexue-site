<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" preserveAspectRatio="none" role="img" aria-label="Moonlit old plum tree in snow">
  <title>Moonlit old plum tree in snow</title>
  <defs>
    <linearGradient id="trunkInk" x1="0.09" y1="0.95" x2="0.85" y2="0.1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="0.34" stop-color="#141814"/>
      <stop offset="0.66" stop-color="#3d3327"/>
      <stop offset="1" stop-color="#8a7152"/>
    </linearGradient>
    <linearGradient id="coldBark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#070a09"/>
      <stop offset="0.48" stop-color="#22251f"/>
      <stop offset="1" stop-color="#6e5a42"/>
    </linearGradient>
    <linearGradient id="snowCap" x1="0" y1="0" x2="1" y2="0">
