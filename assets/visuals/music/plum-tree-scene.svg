      <feGaussianBlur stdDeviation="0.18"/>
    </filter>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="mistBlur" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

